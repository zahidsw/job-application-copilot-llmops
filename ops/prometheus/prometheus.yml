global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets:
          - mcp:8081

  - job_name: evaluator
    static_configs:
      - targets:
          - evaluator:8090
